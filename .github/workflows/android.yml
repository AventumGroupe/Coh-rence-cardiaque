# Construit l'application Android (APK de test et AAB pour Google Play) et la publie dans « Releases ».
# La clé de signature vient des secrets SIGNING_KEYSTORE (fichier .jks en base64) et SIGNING_PASSWORD.
name: APK Android

on:
  push:
    branches: [main]
    paths: ["index.html", "android/**", "fonts/**", "scripts/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Copier l'application web dans le projet Android
        run: npm run sync

      - name: Préparer la clé de signature
        if: env.SIGNING_KEYSTORE != ''
        run: |
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Construire l'APK (tests) et l'AAB (Google Play)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/coherence-cardiaque-test.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/coherence-cardiaque-${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: coherence-cardiaque
          path: dist/*

      # Lien de téléchargement direct, uniquement pour les APK signés avec la clé fixe.
      - name: Publier la version (Release)
        if: env.SIGNING_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cohérence cardiaque 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/coherence-cardiaque-test.apk
            dist/coherence-cardiaque-${{ github.run_number }}.aab
          body: |
            Le fichier **.aab** est à envoyer dans la Google Play Console.
            Télécharger **coherence-cardiaque-test.apk** ci-dessous, l'ouvrir sur le téléphone puis toucher « Installer » ou « Mettre à jour ».
            Lien permanent vers la dernière version :
            https://github.com/${{ github.repository }}/releases/latest/download/coherence-cardiaque-test.apk
